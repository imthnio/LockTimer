<title>定时锁屏</title>

<style>
/* Lucian UX/UI Prompt theme tokens · MIT License (c) 2026 Seokwoooo */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;--ux-surface:#FFFFFF;--ux-surface-2:#F5F3EF;--ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;--ux-ink-2:#57535F;--ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);--ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;--ux-accent-2:#2F8FE0;--ux-accent-soft:rgba(106,87,242,.12);--ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;--ux-warn:#D6731E;--ux-danger:#D93A55;
  --ux-shadow:rgba(40,30,80,.14);--ux-shadow-strong:rgba(40,30,80,.3);
  --ux-ease:cubic-bezier(.2,.8,.2,1);--ux-spring:cubic-bezier(.34,1.45,.64,1);
  --knob:var(--ux-surface);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ux-page:#07080D;--ux-surface:#13141C;--ux-surface-2:#1A1B25;--ux-surface-3:#252632;
    --ux-ink:#F4F0E8;--ux-ink-2:rgba(244,240,232,.68);--ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);--ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;--ux-accent-2:#7DB4FF;--ux-accent-soft:rgba(183,164,255,.15);--ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;--ux-warn:#FFB26B;--ux-danger:#FF7D8C;
    --ux-shadow:rgba(0,0,0,.45);--ux-shadow-strong:rgba(0,0,0,.72);
    --knob:var(--ux-surface-3);
  }
}
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
}
:where(.ux) :is(button,input){font:inherit;color:inherit}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;
  }
}

html,body{margin:0;height:100%;overflow:hidden;background:var(--ux-surface)}
body{-webkit-user-select:none;user-select:none;cursor:default}
button{cursor:default}

.app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:48px 24px 18px;--g1:var(--ux-accent);--g2:var(--ux-accent-2)}
.app.is-off{--g1:var(--ux-danger);--g2:var(--ux-warn)}
.app::before{content:"";position:absolute;left:50%;top:22px;width:300px;height:240px;margin-left:-150px;border-radius:50%;
  background:radial-gradient(closest-side,var(--ux-accent-soft),transparent);pointer-events:none;transition:opacity .6s;opacity:.0}
.app.is-run::before{opacity:1}
.app.is-warn::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--ux-warn) 16%,transparent),transparent)}
.app.is-off::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--ux-danger) 13%,transparent),transparent)}

/* ---------- 类型切换（#039 Sliding pill tabs） ---------- */
.modes{position:absolute;top:7px;left:50%;z-index:2;display:grid;grid-template-columns:1fr 1fr;width:168px;margin-left:-84px;padding:3px;border-radius:999px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1px var(--ux-line);transition:opacity .3s}
.mknob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--ux-ink);transition:transform .5s var(--ux-spring),background-color .4s}
.modes[data-v="shutdown"] .mknob{transform:translateX(100%);background:var(--ux-danger)}
.mode{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;height:26px;border:0;padding:0;border-radius:999px;background:none;font-size:12.5px;font-weight:700;color:var(--ux-ink-3);transition:color .3s,transform .3s var(--ux-spring)}
.mode:hover{color:var(--ux-ink-2)}
.mode:active{transform:scale(.94)}
.mode[aria-selected="true"]{color:var(--ux-surface)}
.mode svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.app.is-run .modes{opacity:.5;pointer-events:none}

/* ---------- 表盘（#067） ---------- */
.dial{position:relative;width:196px;height:196px;flex:none}
.dial>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:8}
.dial .t{stroke:var(--ux-surface-3)}
.dial .p{stroke:url(#ring);transition:stroke .4s;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,1) * 100)}
.app:not(.is-run) .dial .p{transition:stroke-dashoffset .6s var(--ux-ease)}
.app.is-warn .dial .p{stroke:var(--ux-warn)}
.app.is-off.is-warn .dial .p{stroke:var(--ux-danger)}
.ticks{position:absolute;inset:18px;border-radius:50%;background:repeating-conic-gradient(var(--ux-line-2) 0 1deg,transparent 1deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 68%,transparent 69%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 68%,transparent 69%)}
.lock,.pwr{position:absolute;left:50%;top:44px;width:44px;height:50px;margin-left:-22px;transition:opacity .3s var(--ux-ease),scale .5s var(--ux-spring),rotate .5s var(--ux-spring)}
.pwr{opacity:0;scale:.5;rotate:-90deg}
.app.is-off .lock{opacity:0;scale:.5}
.app.is-off .pwr{opacity:1;scale:1;rotate:0deg}
.pwr svg{width:100%;height:100%;overflow:visible}
.pwr path{fill:none;stroke:var(--ux-ink);stroke-width:6;stroke-linecap:round;transition:stroke .4s}
.app.is-off.is-run .pwr path{stroke:var(--ux-danger)}
.lock svg{width:100%;height:100%;overflow:visible}
.sh{fill:none;stroke:var(--ux-ink);stroke-width:6;stroke-linecap:round;transform-origin:46px 30px;transition:transform .7s var(--ux-spring),stroke .4s;transform:translateY(-8px) rotate(28deg)}
.app.is-run .sh{transform:none}
.bd{fill:var(--ux-ink);transition:fill .4s}
.kh{fill:var(--ux-surface)}
.app.is-warn .sh{stroke:var(--ux-warn)}
.app.is-warn .bd{fill:var(--ux-warn)}
.app.is-warn .lock,.app.is-warn .pwr{animation:nudge 1s var(--ux-ease) infinite}
@keyframes nudge{0%,60%,100%{transform:none}70%{transform:rotate(-8deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
.time{position:absolute;left:0;right:0;top:104px;display:flex;justify-content:center;font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.time span,.time b{display:flex;flex-direction:column;height:36px;overflow:hidden}
.time i{display:block;font-style:normal;line-height:36px;text-align:center;transform:translateY(calc(var(--d) * -36px));transition:transform .45s var(--ux-spring)}
.time b{line-height:34px;font-weight:700;color:var(--ux-ink-3);padding:0 1px}
.tlabel{position:absolute;left:0;right:0;top:144px;text-align:center;font-size:12px;font-weight:650;color:var(--ux-ink-3);letter-spacing:.02em}

/* ---------- 标题 ---------- */
.head{margin-top:16px;text-align:center;min-height:52px}
.head h1{margin:0;font-size:22px;font-weight:850;letter-spacing:-.045em}
.head p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--ux-ink-3);font-variant-numeric:tabular-nums}
.swap{animation:swap .5s var(--ux-spring)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 面板 ---------- */
.panels{position:relative;width:100%;height:168px;margin-top:18px}
.panel{position:absolute;inset:0;transition:opacity .35s var(--ux-ease),transform .5s var(--ux-spring),visibility 0s}
.panel[inert]{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s var(--ux-ease),transform .4s var(--ux-ease),visibility 0s .4s}
.setup[inert]{transform:translateY(-10px)}
.run[inert]{transform:translateY(10px)}

/* 分段控件（#047） */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1px var(--ux-line)}
.knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:var(--knob);
  box-shadow:0 4px 12px -6px var(--ux-shadow-strong),0 0 0 1px var(--ux-line);transition:transform .5s var(--ux-spring)}
.seg[data-v="hour"] .knob{transform:translateX(100%)}
.opt{position:relative;height:36px;border:0;padding:0;border-radius:12px;background:none;font-size:14px;font-weight:680;color:var(--ux-ink-3);transition:color .3s,transform .3s var(--ux-spring)}
.opt:hover{color:var(--ux-ink-2)}
.opt:active{transform:scale(.94)}
.opt[aria-checked="true"]{color:var(--ux-ink)}

/* 步进输入（#018） */
.stepper{display:flex;align-items:center;margin-top:12px;height:64px;padding:6px;border-radius:999px;background:var(--ux-surface-2);
  box-shadow:inset 0 0 0 1px var(--ux-line);transition:box-shadow .3s}
.stepper:focus-within{box-shadow:inset 0 0 0 1.5px var(--ux-accent),0 0 0 4px var(--ux-accent-soft)}
.stepper.shake{animation:no .42s var(--ux-ease)}
@keyframes no{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.sb{width:52px;height:52px;flex:none;border:0;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--knob);color:var(--ux-ink);
  box-shadow:0 0 0 1px var(--ux-line),0 6px 14px -10px var(--ux-shadow-strong);transition:transform .4s var(--ux-spring),background-color .25s}
.sb:active{transform:scale(.86)}
.sb.pl{background:var(--ux-ink);color:var(--ux-surface)}
.sb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.field{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;cursor:text}
.field input{width:2.2em;min-width:.8em;border:0;padding:0;background:none;outline:none;text-align:center;font-size:34px;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;caret-color:var(--ux-accent);-webkit-user-select:text;user-select:text}
.field input::placeholder{color:var(--ux-ink-3)}
.field .u{font-size:15px;font-weight:700;color:var(--ux-ink-3)}

/* 快捷选项 */
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;height:34px;border:0;padding:0;border-radius:999px;background:none;box-shadow:inset 0 0 0 1.5px var(--ux-line-2);
  font-size:13px;font-weight:700;color:var(--ux-ink-2);transition:background-color .3s,color .3s,box-shadow .3s,transform .3s var(--ux-spring)}
.chip:hover{background:var(--ux-surface-2)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ux-accent-soft);color:var(--ux-accent);box-shadow:inset 0 0 0 1.5px transparent}
.app.is-off .chip.on{background:color-mix(in srgb,var(--ux-danger) 12%,transparent);color:var(--ux-danger)}
.app.is-off .stepper:focus-within{box-shadow:inset 0 0 0 1.5px var(--ux-danger),0 0 0 4px color-mix(in srgb,var(--ux-danger) 14%,transparent)}

/* 运行中 */
.eta{display:flex;align-items:flex-end;justify-content:space-between;height:110px;padding:18px 20px;border-radius:22px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1px var(--ux-line)}
.eta small{display:block;font-size:12.5px;font-weight:650;color:var(--ux-ink-3)}
.eta b{display:block;margin-top:4px;font-size:40px;font-weight:850;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.eta .r{text-align:right}
.eta .r span{display:block;margin-top:4px;font-size:14px;font-weight:700;color:var(--ux-ink-2);font-variant-numeric:tabular-nums}
.ext{color:var(--ux-ink)}

/* ---------- 按钮 ---------- */
.go{width:100%;height:52px;margin-top:16px;border:0;border-radius:16px;font-size:15px;font-weight:760;flex:none;
  background:var(--ux-ink);color:var(--ux-surface);transition:transform .3s var(--ux-spring),background-color .4s,color .4s,box-shadow .4s}
.go:active{transform:scale(.97)}
.app.is-run .go{background:none;color:var(--ux-ink);box-shadow:inset 0 0 0 1.5px var(--ux-line-2)}
.app.is-run .go:hover{background:var(--ux-surface-2)}
.app.is-off:not(.is-run) .go{background:var(--ux-danger);color:#fff}

/* ---------- 底栏 ---------- */
.foot{width:100%;margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--ux-line)}
.sw{display:flex;align-items:center;gap:9px;border:0;padding:0;background:none;font-size:13px;font-weight:600;color:var(--ux-ink-2)}
.sw i{position:relative;width:36px;height:22px;border-radius:999px;background:var(--ux-surface-3);transition:background-color .3s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .45s var(--ux-spring)}
.sw[aria-checked="true"] i{background:var(--ux-accent)}
.app.is-off .sw[aria-checked="true"] i{background:var(--ux-danger)}
.sw[aria-checked="true"] i::after{transform:translateX(14px)}
.now{display:flex;align-items:center;gap:6px;border:0;padding:6px 10px;margin-right:-10px;border-radius:10px;background:none;font-size:13px;font-weight:650;color:var(--ux-ink-2);transition:background-color .25s,color .25s}
.now:hover{background:var(--ux-surface-2);color:var(--ux-ink)}
.app.is-off .now:hover{color:var(--ux-danger)}
.now svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main class="ux app">
  <nav class="modes" role="tablist" aria-label="类型" data-v="lock">
    <span class="mknob" aria-hidden="true"></span>
    <button class="mode" type="button" role="tab" data-m="lock" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>锁屏</button>
    <button class="mode" type="button" role="tab" data-m="shutdown" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 6.5a7.5 7.5 0 1 0 9 0"/><path d="M12 3v8"/></svg>关机</button>
  </nav>
  <section class="dial" role="timer" aria-live="off">
    <svg viewBox="0 0 168 168" aria-hidden="true">
      <defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/>
      </linearGradient></defs>
      <circle class="t" cx="84" cy="84" r="78"/><circle class="p" cx="84" cy="84" r="78" pathLength="100"/>
    </svg>
    <span class="ticks" aria-hidden="true"></span>
    <span class="lock" aria-hidden="true"><svg viewBox="0 0 62 70"><path class="sh" d="M16 32V22a15 15 0 0 1 30 0v10"/><rect class="bd" x="6" y="30" width="50" height="38" rx="10"/><circle class="kh" cx="31" cy="47" r="5"/><rect class="kh" x="29" y="49" width="4" height="9" rx="2"/></svg></span>
    <span class="pwr" aria-hidden="true"><svg viewBox="0 0 62 70"><path d="M45.1 23.2A22 22 0 1 1 16.9 23.2"/><path d="M31 12v26"/></svg></span>
    <span class="time" aria-hidden="true"></span>
    <span class="tlabel">时长</span>
  </section>

  <header class="head" aria-live="polite"><h1 id="title">定时锁屏</h1><p id="sub">&nbsp;</p></header>

  <div class="panels">
    <div class="panel setup">
      <div class="seg" role="radiogroup" aria-label="单位" data-v="min">
        <span class="knob" aria-hidden="true"></span>
        <button class="opt" type="button" role="radio" data-u="min" aria-checked="true">分钟</button>
        <button class="opt" type="button" role="radio" data-u="hour" aria-checked="false" tabindex="-1">小时</button>
      </div>
      <div class="stepper">
        <button class="sb mi" type="button" aria-label="减少"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <label class="field"><input id="val" type="text" inputmode="decimal" maxlength="5" autocomplete="off" spellcheck="false" placeholder="0" aria-label="时长"><span class="u" id="unitLab">分钟</span></label>
        <button class="sb pl" type="button" aria-label="增加"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="chips">
        <button class="chip preset" type="button" data-v="15" data-u="min">15 分钟</button>
        <button class="chip preset" type="button" data-v="30" data-u="min">30 分钟</button>
        <button class="chip preset" type="button" data-v="1" data-u="hour">1 小时</button>
        <button class="chip preset" type="button" data-v="2" data-u="hour">2 小时</button>
      </div>
    </div>

    <div class="panel run" inert>
      <div class="eta">
        <div><small id="etaLab">预计锁屏</small><b id="eta">--:--</b></div>
        <div class="r"><small id="etaDay">今天</small><span id="etaTotal"></span></div>
      </div>
      <div class="chips">
        <button class="chip ext" type="button" data-s="300">+5 分钟</button>
        <button class="chip ext" type="button" data-s="900">+15 分钟</button>
        <button class="chip ext" type="button" data-s="1800">+30 分钟</button>
        <button class="chip ext" type="button" data-s="3600">+1 小时</button>
      </div>
    </div>
  </div>

  <button class="go" id="go" type="button">开始定时</button>

  <footer class="foot">
    <button class="sw" id="warnSw" type="button" role="switch" aria-checked="true"><i aria-hidden="true"></i>锁屏前 1 分钟提醒</button>
    <button class="now" id="now" type="button"></button>
  </footer>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var app = $('.app'), dial = $('.dial'), time = $('.time'), tlabel = $('.tlabel'), title = $('#title'), sub = $('#sub');
  var seg = $('.seg'), opts = [].slice.call(seg.querySelectorAll('.opt')), input = $('#val'), unitLab = $('#unitLab'), stepper = $('.stepper');
  var setup = $('.setup'), run = $('.run'), go = $('#go'), warnSw = $('#warnSw');
  var eta = $('#eta'), etaDay = $('#etaDay'), etaTotal = $('#etaTotal');
  var presets = [].slice.call(document.querySelectorAll('.preset')), exts = [].slice.call(document.querySelectorAll('.ext'));
  var MAX = 99 * 3600;
  var modes = $('.modes'), tabs = [].slice.call(modes.querySelectorAll('.mode')), nowBtn = $('#now'), etaLab = $('#etaLab');
  var S = { running: false, endMs: 0, totalSec: 0, warn: true, authorized: false }, unit = 'min', mode = 'lock', raf = 0, shown = '', synced = false;
  var ICON = {
    lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    shutdown: '<svg viewBox="0 0 24 24"><path d="M7.5 6.5a7.5 7.5 0 1 0 9 0"/><path d="M12 3v8"/></svg>'
  };

  function post(m) { try { window.webkit.messageHandlers.app.postMessage(m); } catch (e) {} }
  function p2(n) { return ('0' + n).slice(-2); }
  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h > 0 ? h + ':' + p2(m) + ':' + p2(s) : p2(m) + ':' + p2(s);
  }
  function fmtDur(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.round(sec % 60), out = [];
    if (h) out.push(h + ' 小时');
    if (m) out.push(m + ' 分钟');
    if (s && !h) out.push(s + ' 秒');
    return out.join(' ') || '0 分钟';
  }
  function clock(ms) { var d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function dayLabel(ms) {
    var d = new Date(ms), n = new Date();
    var diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
    return diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '后天' : (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function parse() {
    var v = parseFloat(input.value);
    if (!isFinite(v) || v <= 0) return 0;
    return Math.round(v * (unit === 'hour' ? 3600 : 60));
  }

  // 滚动数字（#067）
  function digits(str) {
    if (str === shown) return;
    if (time.children.length !== str.length || str.replace(/\d/g, '') !== shown.replace(/\d/g, '')) {
      time.innerHTML = str.split('').map(function (c) {
        if (c < '0' || c > '9') return '<b>' + c + '</b>';
        var h = ''; for (var n = 0; n < 10; n++) h += '<i>' + n + '</i>';
        return '<span style="--d:' + c + '">' + h + '</span>';
      }).join('');
    } else str.split('').forEach(function (c, k) { if (c >= '0' && c <= '9') time.children[k].style.setProperty('--d', c); });
    shown = str;
  }

  function setText(el, text) {
    if (el.textContent === text) return;
    el.textContent = text;
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }
  function setHead() {
    var warn = app.classList.contains('is-warn'), off = mode === 'shutdown';
    if (S.running) {
      setText(title, warn ? (off ? '即将关机' : '即将锁屏') : (off ? '关机倒计时' : '定时已开启'));
      setText(sub, off ? (warn ? '不到 1 分钟，请立即保存工作' : '到时间将直接关机，未保存的内容会丢失')
                       : (warn ? '不到 1 分钟，记得保存手头的工作' : '到时间后会自动锁定屏幕'));
    } else {
      var sec = parse();
      setText(title, off ? '定时关机' : '定时锁屏');
      setText(sub, !sec ? '输入要等待的分钟或小时'
        : sec > MAX ? '最长 99 小时'
        : off && !S.authorized ? '首次使用需管理员授权，之后到点直接关机'
        : '将于' + dayLabel(Date.now() + sec * 1000) + ' ' + clock(Date.now() + sec * 1000) + (off ? ' 强制关机' : ' 锁屏'));
    }
  }

  function sizeInput() { input.style.width = Math.max(1, input.value.length) * 0.62 + 0.3 + 'em'; }

  function idle() {
    var sec = parse();
    dial.style.setProperty('--p', sec ? 1 : 0);
    digits(fmt(Math.min(sec, MAX)));
    tlabel.textContent = '时长';
    presets.forEach(function (c) { c.classList.toggle('on', c.dataset.u === unit && parseFloat(c.dataset.v) === parseFloat(input.value)); });
    sizeInput();
    setHead();
  }

  function frame() {
    if (!S.running) return;
    var left = Math.max(0, (S.endMs - Date.now()) / 1000);
    dial.style.setProperty('--p', S.totalSec ? (left / S.totalSec).toFixed(4) : 0);
    digits(fmt(left));
    dial.setAttribute('aria-label', '剩余 ' + fmtDur(Math.ceil(left)));
    var warn = left <= 60;
    if (warn !== app.classList.contains('is-warn')) { app.classList.toggle('is-warn', warn); setHead(); }
    raf = requestAnimationFrame(frame);
  }

  function setUnit(u) {
    unit = u === 'hour' ? 'hour' : 'min';
    seg.dataset.v = unit;
    opts.forEach(function (o) {
      var on = o.dataset.u === unit;
      o.setAttribute('aria-checked', on);
      o.tabIndex = on ? 0 : -1;
    });
    unitLab.textContent = unit === 'hour' ? '小时' : '分钟';
    idle();
  }

  function setMode(m) {
    mode = m === 'shutdown' ? 'shutdown' : 'lock';
    var off = mode === 'shutdown';
    modes.dataset.v = mode;
    tabs.forEach(function (t) {
      var on = t.dataset.m === mode;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
    });
    app.classList.toggle('is-off', off);
    etaLab.textContent = off ? '预计关机' : '预计锁屏';
    nowBtn.innerHTML = ICON[mode] + (off ? '立即关机' : '立即锁屏');
    setGo();
    setHead();
  }
  function setGo() { go.textContent = S.running ? '取消定时' : mode === 'shutdown' ? '开始定时关机' : '开始定时'; }

  // Swift 推送状态
  window.appState = function (st) {
    if (!synced && !st.running && st.value != null) { input.value = st.value; setUnit(st.unit); }
    synced = true;
    S = st;
    if (st.mode) setMode(st.mode);
    warnSw.setAttribute('aria-checked', st.warn !== false);
    app.classList.toggle('is-run', !!st.running);
    setup.inert = !!st.running;
    run.inert = !st.running;
    setGo();
    cancelAnimationFrame(raf);
    if (st.running) {
      eta.textContent = clock(st.endMs);
      etaDay.textContent = dayLabel(st.endMs);
      etaTotal.textContent = '共 ' + fmtDur(st.totalSec);
      tlabel.textContent = '剩余';
      setHead();
      frame();
    } else {
      app.classList.remove('is-warn');
      idle();
    }
  };

  function shake() { stepper.classList.remove('shake'); void stepper.offsetWidth; stepper.classList.add('shake'); input.focus(); }
  function start() {
    var sec = parse();
    if (!sec || sec > MAX) { shake(); return; }
    input.blur();
    post({ cmd: 'start', seconds: sec, value: input.value, unit: unit, mode: mode });
    if (!window.webkit) window.appState({ running: true, endMs: Date.now() + sec * 1000, totalSec: sec, warn: S.warn, mode: mode, authorized: true });
  }
  function cancel() {
    post({ cmd: 'cancel' });
    if (!window.webkit) window.appState({ running: false, warn: S.warn, mode: mode, authorized: S.authorized });
  }

  go.addEventListener('click', function () { S.running ? cancel() : start(); });
  input.addEventListener('input', function () {
    var v = input.value.replace(/[^\d.]/g, '').replace(/^\./, '0.').replace(/(\..*)\./g, '$1');
    if (v !== input.value) input.value = v;
    idle();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); start(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); step(-1); }
  });
  $('.field').addEventListener('mousedown', function (e) { if (e.target !== input) { e.preventDefault(); input.focus(); } });

  function step(dir) {
    var v = parseFloat(input.value) || 0;
    if (unit === 'min') {
      v = dir > 0 ? (v < 5 ? Math.floor(v) + 1 : Math.floor(v / 5) * 5 + 5)
                  : (v <= 5 ? Math.max(1, Math.ceil(v) - 1) : Math.ceil(v / 5) * 5 - 5);
      v = Math.min(v, 5940);
    } else {
      v = dir > 0 ? Math.floor(v * 2) / 2 + 0.5 : Math.max(0.5, Math.ceil(v * 2) / 2 - 0.5);
      v = Math.min(v, 99);
    }
    input.value = String(+v.toFixed(2));
    idle();
  }
  $('.sb.mi').addEventListener('click', function () { step(-1); });
  $('.sb.pl').addEventListener('click', function () { step(1); });

  opts.forEach(function (o) { o.addEventListener('click', function () { setUnit(o.dataset.u); }); });
  seg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      setUnit(e.key === 'ArrowLeft' ? 'min' : 'hour');
      seg.querySelector('[aria-checked="true"]').focus();
    }
  });
  presets.forEach(function (c) { c.addEventListener('click', function () { input.value = c.dataset.v; setUnit(c.dataset.u); }); });
  exts.forEach(function (c) { c.addEventListener('click', function () { post({ cmd: 'extend', seconds: +c.dataset.s }); }); });
  warnSw.addEventListener('click', function () {
    var on = warnSw.getAttribute('aria-checked') !== 'true';
    warnSw.setAttribute('aria-checked', on);
    S.warn = on;
    post({ cmd: 'setWarn', on: on });
  });
  nowBtn.addEventListener('click', function () { post({ cmd: mode === 'shutdown' ? 'shutdownNow' : 'lockNow' }); });
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { if (S.running) return; setMode(t.dataset.m); post({ cmd: 'setMode', mode: mode }); });
  });
  modes.addEventListener('keydown', function (e) {
    if (S.running || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    setMode(e.key === 'ArrowLeft' ? 'lock' : 'shutdown');
    post({ cmd: 'setMode', mode: mode });
    modes.querySelector('[aria-selected="true"]').focus();
  });
  document.addEventListener('contextmenu', function (e) { if (e.target !== input) e.preventDefault(); });

  // 空闲时每秒刷新“将于 xx:xx 锁屏”
  setInterval(function () { if (!S.running) setHead(); }, 1000);

  input.value = '25';
  setUnit('min');
  setMode('lock');
})();
</script>
</body>
</html>
